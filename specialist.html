<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Specialist dashboard | Neatly</title>
  <link rel="stylesheet" href="neatly.css">
</head>
<body>
<header>
  <nav class="wrap" aria-label="Main navigation">
    <a class="brand" href="./" aria-label="Neatly home">Neatly<span>.</span></a>
    <div class="nav-links"><a href="./">Home</a><a href="cleaners.html">Find Cleaning Specialists</a><a href="services.html">Services</a><a href="bookings.html">My Bookings</a><a href="apply.html">Apply as a Cleaning Specialist</a><a href="./#request">Request cleaning</a></div>
  </nav>
</header>
<main class="wrap" style="padding-block:3rem">
  <h1>Specialist dashboard</h1>
  <p class="intro">Sign in with the email linked to your specialist profile.</p>
  <div id="booking-account">
  <p id="account-status" role="status"></p>
  <form id="booking-signin" hidden>
    <label>Email for your specialist account<input type="email" name="email" autocomplete="email" required></label>
    <button class="button" type="submit">Email me a sign-in link</button>
  </form>
  <button type="button" id="booking-signout" hidden>Sign out</button>
</div>
  <section id="specialist-history" hidden aria-label="Assigned requests"><p id="history-status" role="status"></p><ul id="booking-list"></ul></section>
</main>
<footer><div class="wrap"><a class="brand" href="./" aria-label="Neatly home">Neatly.</a><p>Cleaning made simple.</p></div></footer>
<script type="module" src="neatly-bookings.js"></script>
</body>
