<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Request residential or commercial cleaning in Jamaica, or apply to join Neatly as an independent cleaning professional.">
  <title>Find a cleaner | Neatly</title>
  <link rel="stylesheet" href="neatly.css">
</head>
<body>
<header>
  <nav class="wrap" aria-label="Main navigation">
    <a class="brand" href="./" aria-label="Neatly home">Neatly<span>.</span></a>
    <div class="nav-links"><a href="./">Home</a><a href="cleaners.html" aria-current="page">Find a cleaner</a><a href="services.html">Services</a><a href="apply.html">Apply as a cleaner</a><a href="./#request">Request cleaning</a></div>
  </nav>
</header>
<main class="wrap" style="padding-block:3rem">
  <h1>Find a cleaner</h1>
  <p class="intro">Browse approved Cleaning Specialists for your home or business.</p>
  <div id="filters" hidden><div class="fields">
    <label>Location<input id="location-filter" type="search" placeholder="Town, parish or country"></label>
    <label>Service<select id="service-filter"><option value="">All services</option></select></label>
    <label>Hourly rate<select id="rate-sort"><option value="">Any rate</option><option value="low">Low to high</option><option value="high">High to low</option></select></label>
  </div></div>
  <p id="directory-status" role="status">Loading cleaner profiles…</p>
  <div id="cleaner-list" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));gap:1rem"></div>
  <noscript>Enable JavaScript to browse cleaner profiles.</noscript>
</main>
<footer><div class="wrap"><a class="brand" href="./" aria-label="Neatly home">Neatly.</a><p>Cleaning made simple.</p></div></footer>
<script src="neatly-directory.js" defer></script>
</body>
</html>
